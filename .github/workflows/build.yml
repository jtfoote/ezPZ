name: Build Linux, macOS & Windows Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ... rest of your jobs ...
  # ---------------------------------------------------------------------------
  # 1. Linux Standalone AppImage, Portable Bundle & Start Menu Installer (x86_64)
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Qt6 & AppImage packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0 libfuse2 file desktop-file-utils

      - name: Install Qt 6 for Linux
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'

      - name: Fetch Eigen3 (Header-Only)
        run: |
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git
          cmake -B eigen/build -S eigen -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/eigen_install"
          cmake --install eigen/build

      - name: Configure, Build, and Package Linux AppImage
        run: |
          SRC_DIR="."
          if [ -f "cpp/CMakeLists.txt" ]; then SRC_DIR="cpp"; fi

          cmake -S "$SRC_DIR" -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DEigen3_DIR="$RUNNER_TEMP/eigen_install/share/eigen3/cmake"
          cmake --build build-linux --config Release --parallel

          # Prepare AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build-linux/ezpz AppDir/usr/bin/

          cat << 'DESKTOP' > AppDir/usr/share/applications/ezPZ.desktop
          [Desktop Entry]
          Type=Application
          Name=ezPZ
          Comment=Interactive Control Systems & DSP Engineering Suite
          Exec=ezpz
          Icon=ezPZ
          Terminal=false
          Categories=Science;Engineering;Education;
          DESKTOP

          # Generate a clean vector icon required by linuxdeploy
          cat << 'SVG' > AppDir/usr/share/icons/hicolor/scalable/apps/ezPZ.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="12" fill="#0b0f19"/>
            <path d="M8 32 H56 M32 8 V56" stroke="#475569" stroke-width="2"/>
            <path d="M12 48 Q28 8 44 32 T56 20" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <circle cx="24" cy="24" r="4" fill="#ef4444"/>
            <circle cx="24" cy="40" r="4" fill="#ef4444"/>
          </svg>
          SVG

          # Download linuxdeploy and its Qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          export QMAKE="$(which qmake6 || which qmake)"
          export EXTRA_QT_PLUGINS="svg;iconengines;wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration"
          export LDAI_OUTPUT="ezPZ-Linux-x86_64.AppImage"

          # Run linuxdeploy (using --appimage-extract-and-run for CI compatibility)
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/ezpz \
            --desktop-file AppDir/usr/share/applications/ezPZ.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/ezPZ.svg \
            --plugin qt \
            --output appimage

          # Create an automatic Start Menu installer script for the target Linux machine
          cat << 'INSTALLER' > install.sh
          #!/usr/bin/env bash
          set -e
          APP_DIR="$HOME/.local/opt/ezPZ"
          mkdir -p "$APP_DIR" "$HOME/.local/share/applications" "$HOME/.local/share/icons/hicolor/scalable/apps"

          cp -f ezPZ-Linux-x86_64.AppImage "$APP_DIR/"
          chmod +x "$APP_DIR/ezPZ-Linux-x86_64.AppImage"
          cp -f ezPZ.svg "$HOME/.local/share/icons/hicolor/scalable/apps/"

          cat << EOF > "$HOME/.local/share/applications/ezPZ.desktop"
          [Desktop Entry]
          Type=Application
          Name=ezPZ
          Comment=Interactive Control Systems & DSP Engineering Suite
          Exec=$APP_DIR/ezPZ-Linux-x86_64.AppImage
          Icon=$HOME/.local/share/icons/hicolor/scalable/apps/ezPZ.svg
          Terminal=false
          Categories=Science;Engineering;Education;
          EOF

          chmod +x "$HOME/.local/share/applications/ezPZ.desktop"
          update-desktop-database "$HOME/.local/share/applications" 2>/dev/null || true
          echo "✅ ezPZ installed! You can now launch it from your Start Menu."
          INSTALLER
          chmod +x install.sh
          cp AppDir/usr/share/icons/hicolor/scalable/apps/ezPZ.svg .

          # Also create a standard .tar.gz portable bundle (in case FUSE isn't installed on the target machine)
          tar -czf ezPZ-Linux-x86_64-Portable.tar.gz -C AppDir .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezPZ-Linux-x86_64
          path: |
            ezPZ-Linux-x86_64.AppImage
            ezPZ-Linux-x86_64-Portable.tar.gz
            ezPZ.svg
            install.sh

  # ---------------------------------------------------------------------------
  # 2. macOS Universal Binary (.dmg & .zip) for Older Intel + Apple Silicon Macs
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (Universal Binary)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'

      - name: Fetch Eigen3 (Header-Only)
        run: |
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git
          cmake -B eigen/build -S eigen -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/eigen_install"
          cmake --install eigen/build

      - name: Configure, Build, and Package Universal macOS .app & .dmg
        run: |
          SRC_DIR="."
          if [ -f "cpp/CMakeLists.txt" ]; then SRC_DIR="cpp"; fi

          cmake -S "$SRC_DIR" -B build-mac -DCMAKE_BUILD_TYPE=Release \
            -DEigen3_DIR="$RUNNER_TEMP/eigen_install/share/eigen3/cmake" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"
          cmake --build build-mac --config Release --parallel

          APP_PATH="build-mac/ezpz.app"
          macdeployqt "$APP_PATH" -always-overwrite
          codesign --force --deep --sign - "$APP_PATH"

          hdiutil create -volname "ezPZ" \
            -srcfolder "$APP_PATH" -ov -format UDZO \
            ezPZ-macOS-Universal.dmg

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" ezPZ-macOS-Universal-App.zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezPZ-macOS-Universal
          path: |
            ezPZ-macOS-Universal.dmg
            ezPZ-macOS-Universal-App.zip

  # ---------------------------------------------------------------------------
  # 3. Windows 64-bit Standalone Executable (.zip)
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 for Windows MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'

      - name: Fetch Eigen3 (Header-Only)
        shell: bash
        run: |
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git
          cmake -B eigen/build -S eigen -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/eigen_install"
          cmake --install eigen/build

      - name: Configure, Build, and Bundle Windows .exe with windeployqt
        shell: bash
        run: |
          SRC_DIR="."
          if [ -f "cpp/CMakeLists.txt" ]; then SRC_DIR="cpp"; fi

          cmake -S "$SRC_DIR" -B build-win \
            -DCMAKE_BUILD_TYPE=Release \
            -DEigen3_DIR="$RUNNER_TEMP/eigen_install/share/eigen3/cmake"
          cmake --build build-win --config Release --parallel

          mkdir -p dist-win
          if [ -f "build-win/Release/ezpz.exe" ]; then
            cp "build-win/Release/ezpz.exe" dist-win/
          else
            cp "build-win/ezpz.exe" dist-win/
          fi

          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist-win/ezpz.exe

      - name: Upload Windows .zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezPZ-Windows-x64
          path: dist-win/